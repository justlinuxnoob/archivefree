name: Release

# Tagging v0.1.0 (or any v*) is all it takes: this builds both package formats
# and attaches them to a GitHub Release with no manual steps.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for a manual re-run)'
        required: true

permissions:
  contents: write

jobs:
  deb:
    name: Build .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in the source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          source_version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' archivefree/_version.py)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::Tag $tag_version does not match __version__ $source_version"
            exit 1
          fi

      - name: Build
        run: packaging/deb/build.sh

      - name: Install it, to prove the package actually works
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/archivefree_*_all.deb
          archivefree --version

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: archivefree.flatpak
          manifest-path: packaging/flatpak/io.github.justlinuxnoob.ArchiveFree.yml
          cache-key: flatpak-builder-${{ github.sha }}
          # The runner has no working FUSE, same as most CI sandboxes.
          arch: x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: archivefree.flatpak
          if-no-files-found: error

  release:
    name: Publish release
    needs: [deb, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the files
        run: |
          mkdir -p release
          cp artifacts/deb/*.deb release/
          cp artifacts/flatpak/archivefree.flatpak release/
          cd release && sha256sum * > SHA256SUMS
          ls -la

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Install

            **Debian, Ubuntu, MX Linux, Mint** — download the `.deb` below, then:

            ```
            sudo apt install ./archivefree_*_all.deb
            ```

            **Any distribution with Flatpak** — download `archivefree.flatpak`, then:

            ```
            flatpak install --user archivefree.flatpak
            ```

            The Flatpak bundles its own 7-Zip, so every supported format works
            straight away. With the `.deb`, `sudo apt install 7zip` adds 7z,
            RAR, ISO and encrypted ZIP support.

            Checksums are in `SHA256SUMS`.
