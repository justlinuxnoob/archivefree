[project]
name = "archivefree"
description = "Look inside archives before unpacking them"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dynamic = ["version"]
# PyGObject is intentionally not listed: it must come from the distribution's
# own package (python3-gi), because pip's build of it needs GTK development
# headers that a normal user won't have.
dependencies = []

[project.urls]
Homepage = "https://github.com/justlinuxnoob/archivefree"
Issues = "https://github.com/justlinuxnoob/archivefree/issues"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "SIM108",
    # Catching broad exceptions is deliberate where we translate tool failures
    # into user-facing messages; a stray crash there would be worse.
    "B904",
    # User-facing strings use real typographic quotes and dashes ("don't", "—").
    # That is deliberate polish, not an accident, and the app's text is the
    # part users actually read.
    "RUF001", "RUF002", "RUF003",
    # contextlib.suppress is a context-manager setup per iteration; several of
    # these sit in per-file loops where try/except is both cheaper and clearer.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and long descriptive names freely.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:archivefree.*"]
